{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gerencie suas finanças em um só lugar.">
    <title>{% block title %}FinanceR{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %} 
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'home' %}">FinanceR<span>.</span></a>
        <nav aria-label="Navegação principal">
            <a href="{% url 'home' %}">Início</a>
            <a class="nav-action" href="{% url 'users:register' %}">Criar conta</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/main.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
